name: Bump formula from distribution bucket

# cotomu CLI の公開配布バケット (gs://cotomu-cli-dist、HTTPS で誰でも読める) の
# latest.txt を確認し、formula が古ければ checksums.txt から再生成して commit する。
#
# 起動経路は workflow_dispatch のみ (毎時 cron は全廃済み):
#   - 通常は cotomu 本体のリリース workflow (cli-release-reusable.yml) が
#     専用 GitHub App の短命 installation token で自動 dispatch する。
#     dispatch 失敗はリリース側で release job ごと fail する設計のため、
#     formula が黙って古いまま残ることはない (cron バックアップ不要)。
#   - 手動復旧: `gh workflow run bump-formula.yml -R addinginc/homebrew-tap`
#   - formula の生成・commit 自体は自リポジトリの GITHUB_TOKEN だけで完結する
#     (cross-repo の長命 PAT はどちらのリポジトリにも置かない)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bump-formula
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render formula if a new release exists
        id: render
        run: |
          set -eu
          base="https://storage.googleapis.com/cotomu-cli-dist/cli"

          tag="$(curl -fsSL "${base}/latest.txt" | tr -d '[:space:]')"
          case "$tag" in
            cli-v*) ;;
            *)
              echo "::error::unexpected latest.txt content: ${tag}"
              exit 1
              ;;
          esac

          current="$(grep -oE 'version "[0-9][0-9.]*"' Formula/cotomu.rb | grep -oE '[0-9][0-9.]*' || true)"
          if [ "cli-v${current}" = "$tag" ]; then
            echo "formula is up-to-date (${tag})"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "updating formula: cli-v${current:-<none>} -> ${tag}"
          curl -fsSL "${base}/${tag}/checksums.txt" -o /tmp/checksums.txt
          ./scripts/render-formula.sh "$tag" /tmp/checksums.txt > Formula/cotomu.rb
          ruby -c Formula/cotomu.rb

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.render.outputs.changed == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cotomu.rb
          git commit -m "cotomu ${{ steps.render.outputs.tag }}"
          git push
