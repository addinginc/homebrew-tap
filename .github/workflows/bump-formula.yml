name: Bump formula from distribution bucket

# cotomu CLI の公開配布バケット (gs://cotomu-cli-dist、HTTPS で誰でも読める) の
# latest.txt を確認し、formula が古ければ checksums.txt から再生成して commit する。
#
# 起動経路は workflow_dispatch のみ (毎時 cron は 2026-08-20 に全廃):
#   - cotomu CLI のリリース後に、手元から手動で dispatch する運用:
#       gh workflow run bump-formula.yml -R addinginc/homebrew-tap
#     (cotomu 本体のリリース workflow からの自動 dispatch は、cross-repo token を
#      本体リポジトリに置かない方針のため行わない)
#   - ⚠️ 叩き忘れると CI は何も失敗せず formula だけが古いまま残る。
#     手順は cotomu の docs/operations/cli-release.md「4. Homebrew formula の反映」に必須ステップとして記載。
#   - 冪等: formula が既に最新なら commit step は skip される。遅れて叩いても
#     latest.txt を見て再生成するので正しい最新版に復旧する。
#   - formula の生成・commit 自体は自リポジトリの GITHUB_TOKEN だけで完結する
#     (cross-repo の長命 PAT はどちらのリポジトリにも置かない)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bump-formula
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render formula if a new release exists
        id: render
        run: |
          set -eu
          base="https://storage.googleapis.com/cotomu-cli-dist/cli"

          tag="$(curl -fsSL "${base}/latest.txt" | tr -d '[:space:]')"
          case "$tag" in
            cli-v*) ;;
            *)
              echo "::error::unexpected latest.txt content: ${tag}"
              exit 1
              ;;
          esac

          current="$(grep -oE 'version "[0-9][0-9.]*"' Formula/cotomu.rb | grep -oE '[0-9][0-9.]*' || true)"
          if [ "cli-v${current}" = "$tag" ]; then
            echo "formula is up-to-date (${tag})"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "updating formula: cli-v${current:-<none>} -> ${tag}"
          curl -fsSL "${base}/${tag}/checksums.txt" -o /tmp/checksums.txt
          ./scripts/render-formula.sh "$tag" /tmp/checksums.txt > Formula/cotomu.rb
          ruby -c Formula/cotomu.rb

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.render.outputs.changed == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cotomu.rb
          git commit -m "cotomu ${{ steps.render.outputs.tag }}"
          git push
