name: Bump formula from distribution bucket

# cotomu CLI の公開配布バケット (gs://cotomu-cli-dist、HTTPS で誰でも読める) の
# latest.txt を確認し、formula が古ければ checksums.txt から再生成して commit する。
#
# 起動経路は 2 つ (cotomu 本体のリリース workflow からの自動 dispatch は、cross-repo token を
# 本体リポジトリに置かない方針のため行わない):
#   1. workflow_dispatch — リリース直後に即時反映したいとき手元から叩く (推奨):
#        gh workflow run bump-formula.yml -R addinginc/homebrew-tap
#   2. 日次 cron — 1. を叩き忘れたときの安全網。最大 24 時間以内に自動追従する。
#      毎時 cron から日次へ変更した (2026-08-20): このリポジトリは public なので
#      Actions の課金は 0 だが、リリースは月数回のため毎時は空振りが大半だった。
#
# 冪等: formula が既に最新なら commit step は skip される。遅れて実行しても
# latest.txt を見て再生成するので、常に正しい最新版へ収束する。
#
# ⚠️ GitHub 仕様: リポジトリが 60 日間更新なしだと schedule が自動停止する。
#    CLI のリリースが 60 日以上空いた場合、cron は止まっている前提で 1. の手動 dispatch を使うこと
#    (formula が bump されればリポジトリが更新され、cron は再び有効になる)。
#
# formula の生成・commit 自体は自リポジトリの GITHUB_TOKEN だけで完結する
# (cross-repo の長命 PAT はどちらのリポジトリにも置かない)。

on:
  schedule:
    # 06:17 JST (21:17 UTC) — 日本の業務開始前に前日のリリースを拾う。
    # 毎時実行の負荷集中を避けるため :00 ではなく :17 に置く (GitHub の推奨)。
    - cron: "17 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bump-formula
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render formula if a new release exists
        id: render
        run: |
          set -eu
          base="https://storage.googleapis.com/cotomu-cli-dist/cli"

          tag="$(curl -fsSL "${base}/latest.txt" | tr -d '[:space:]')"
          case "$tag" in
            cli-v*) ;;
            *)
              echo "::error::unexpected latest.txt content: ${tag}"
              exit 1
              ;;
          esac

          current="$(grep -oE 'version "[0-9][0-9.]*"' Formula/cotomu.rb | grep -oE '[0-9][0-9.]*' || true)"
          if [ "cli-v${current}" = "$tag" ]; then
            echo "formula is up-to-date (${tag})"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "updating formula: cli-v${current:-<none>} -> ${tag}"
          curl -fsSL "${base}/${tag}/checksums.txt" -o /tmp/checksums.txt
          ./scripts/render-formula.sh "$tag" /tmp/checksums.txt > Formula/cotomu.rb
          ruby -c Formula/cotomu.rb

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.render.outputs.changed == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cotomu.rb
          git commit -m "cotomu ${{ steps.render.outputs.tag }}"
          git push
